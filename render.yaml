services:
  # ── 1. Backend Web Service (FastAPI) ──────────────────────────────
  - type: web
    name: brandtrace
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_ROLE_SWITCHER
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "https://brandtrace-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173"

  # ── 2. Frontend Static Site (React + Vite) ───────────────────────
  - type: static
    name: brandtrace-frontend
    rootDir: frontend
    buildCommand: "npm install --include=dev && npm run build"
    staticPublishPath: "dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://brandtrace.onrender.com
      - key: VITE_ALLOW_ROLE_SWITCHER
        value: "false"
